plugins {
    id 'java'
}

group = 'si.f5.InfinityDevs'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.glaremasters.me/repository/towny/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.20.6-R0.1-SNAPSHOT"
    compileOnly "com.palmergames.bukkit.towny:towny:0.100.4.0"
}

tasks.register('runServer', Exec) {
    dependsOn build

    workingDir = file("testserver")

    commandLine(
            javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(21)
            }.get().executablePath.asFile.absolutePath,
            "-Xms1G",
            "-Xmx2G",
            "-jar",
            "paper.jar",
    )

    doFirst {
        copy {
            from "build/libs"
            include "*.jar"
            into "testserver/plugins"
        }
    }
}


